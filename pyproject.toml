[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-tuya"
version = "0.1.2"
description = "MCP server for controlling Tuya smart home devices via Claude Desktop and other MCP clients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Juan Manuel" }
]
keywords = ["mcp", "tuya", "smart-home", "iot", "claude", "llm", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=2.0.0",
    "tuya-connector-python>=0.1.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mcp-server-tuya = "mcp_server_tuya:main"

[project.urls]
Homepage = "https://github.com/juanmartinsantos/mcp-server-tuya"
Repository = "https://github.com/juanmartinsantos/mcp-server-tuya"
Issues = "https://github.com/juanmartinsantos/mcp-server-tuya/issues"
